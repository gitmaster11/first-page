<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bro'ning Shaxsiy Sahifasi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #7f8c8d;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .interests {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
        }
        .badge {
            background-color: #3498db;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .badge.football { background-color: #27ae60; }
        .badge.robotics { background-color: #e67e22; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Assalomu Alaykum, Bro!</h1>
        <p>Bu sahifa Visual Studio orqali yaratildi va hozirgina terminal (yoki VS interfeysi) yordamida muvaffaqiyatli tarzda GitHub'ga yuklandi!</p>
        
        <div class="interests">
            <span class="badge football">⚽ Futbol</span>
            <span class="badge robotics">🤖 Robototexnika (WeDo 2.0)</span>
        </div>
    </div>

</body>
</html>
