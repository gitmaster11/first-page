<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete</title>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="form-header">
                <h2>Delete</h2>
            </div>
            <form action="" method="post">`
                {% csrf_token %}
                <div class="form-group">
                    <label for="delete-username">Username:</label>
                    <input type="text" id="delete-username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="delete-password">Password:</label>
                    <input type="password" id="delete-password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="delete-email">Email:</label>
                    <input type="email" id="delete-email" name="email"required>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn">Delete</button>
                </div>
                <div class="form-footer">
                </div>
            </form>
        </div>
</body>
</html>
